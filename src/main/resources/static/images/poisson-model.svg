<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 175" fill="none" role="img" aria-labelledby="poissonTitle poissonDesc">
  <title id="poissonTitle">Poisson Distribution Conceptual Diagram</title>
  <desc id="poissonDesc">Conceptual schematic showing discrete transmission drops occurring across a fixed time interval [0, T] alongside a qualitative Poisson probability bar profile.</desc>

  <rect width="440" height="175" rx="12" fill="#070B15"/>
  <rect x="0.5" y="0.5" width="439" height="174" rx="11.5" stroke="#1E293B"/>

  <!-- Left zone: Fixed interval timeline [0, T] -->
  <text x="18" y="24" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8">FIXED INTERVAL [0, T]</text>
  <rect x="18" y="34" width="212" height="58" rx="8" fill="#0B1222" stroke="#1E293B"/>

  <!-- Interval axis -->
  <line x1="34" y1="68" x2="214" y2="68" stroke="#475569" stroke-width="1.6"/>
  <line x1="34" y1="61" x2="34" y2="75" stroke="#64748B" stroke-width="1.5"/>
  <line x1="214" y1="61" x2="214" y2="75" stroke="#64748B" stroke-width="1.5"/>
  <text x="31" y="85" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">0</text>
  <text x="210" y="85" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9">T</text>

  <!-- Discrete transmission drop markers -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round">
    <line x1="65" y1="53" x2="73" y2="61"/>
    <line x1="73" y1="53" x2="65" y2="61"/>

    <line x1="112" y1="53" x2="120" y2="61"/>
    <line x1="120" y1="53" x2="112" y2="61"/>

    <line x1="138" y1="53" x2="146" y2="61"/>
    <line x1="146" y1="53" x2="138" y2="61"/>

    <line x1="178" y1="53" x2="186" y2="61"/>
    <line x1="186" y1="53" x2="178" y2="61"/>
  </g>
  <circle cx="69" cy="68" r="3" fill="#38BDF8"/>
  <circle cx="116" cy="68" r="3" fill="#38BDF8"/>
  <circle cx="142" cy="68" r="3" fill="#38BDF8"/>
  <circle cx="182" cy="68" r="3" fill="#38BDF8"/>

  <!-- Bottom left legend -->
  <rect x="18" y="104" width="212" height="53" rx="8" fill="#0B1222" stroke="#1E293B"/>
  <circle cx="32" cy="122" r="3.5" fill="#38BDF8"/>
  <text x="43" y="125" fill="#E2E8F0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10.5" font-weight="500">Transmission Drop Event</text>
  <text x="30" y="144" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5">X = drop count at mean rate λ</text>

  <!-- Right zone: Conceptual PMF shape -->
  <text x="252" y="24" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8">PMF PROFILE P(X = k)</text>
  <rect x="252" y="34" width="170" height="123" rx="8" fill="#0B1222" stroke="#1E293B"/>

  <!-- Axes -->
  <line x1="274" y1="48" x2="274" y2="134" stroke="#475569" stroke-width="1.2"/>
  <line x1="274" y1="134" x2="406" y2="134" stroke="#475569" stroke-width="1.2"/>

  <!-- Subtle horizontal guide lines -->
  <line x1="274" y1="74" x2="406" y2="74" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="274" y1="104" x2="406" y2="104" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Qualitative discrete Poisson bars (unimodal shape) -->
  <rect x="284" y="114" width="12" height="20" rx="2" fill="#1D4ED8" opacity="0.65"/>
  <rect x="302" y="88" width="12" height="46" rx="2" fill="#2563EB" opacity="0.85"/>
  <rect x="320" y="64" width="12" height="70" rx="2" fill="#38BDF8"/>
  <rect x="338" y="74" width="12" height="60" rx="2" fill="#38BDF8" opacity="0.85"/>
  <rect x="356" y="98" width="12" height="36" rx="2" fill="#2563EB" opacity="0.7"/>
  <rect x="374" y="118" width="12" height="16" rx="2" fill="#1D4ED8" opacity="0.55"/>
  <rect x="392" y="128" width="10" height="6" rx="1.5" fill="#1E3A8A" opacity="0.45"/>

  <text x="287" y="147" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">0</text>
  <text x="323" y="147" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">k</text>
  <text x="386" y="147" fill="#64748B" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5">...</text>
</svg>

